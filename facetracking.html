<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Deconstruction: Refined Textures</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root { --bg-color: #050507; --accent: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background-color: var(--bg-color); 
            font-family: 'Helvetica', Arial, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #background-video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            overflow: hidden;
        }
        
        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: blur(8px) grayscale(0.5) brightness(0.4); 
            pointer-events: none;
        }

        #canvas-container { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 3; 
            pointer-events: none;
        }

        #ui-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 4;
            pointer-events: none;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; color: #fff; letter-spacing: 2px; text-align: center;
            font-size: 0.8rem; font-weight: 300;
        }
    </style>
</head>
<body>

    <div id="loading">校准神经链接...</div>
    
    <div id="background-video-container">
        <video id="input_video" autoplay playsinline muted disablePictureInPicture></video>
    </div>

    <div id="canvas-container"></div>
    <canvas id="ui-canvas"></canvas>

    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec2 vUv;
        uniform sampler2D tDiffuse;
        uniform vec2 uvOffset;
        uniform vec2 uvRandomOffset;
        uniform float uvScale;
        uniform int filterType;
        uniform float time;
        uniform float borderThickness;
        uniform float textureIntensity;
        uniform float blinkPulse;

        float rand(vec2 co){
            return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
        }

        void main() {
            vec2 baseUv = uvOffset + uvRandomOffset + (vUv - 0.5) * uvScale;
            baseUv = clamp(baseUv, 0.001, 0.999);
            
            vec3 color;

            // 0: 原色清晰 (Sharp/Clear)
            if (filterType == 0) {
                vec3 center = texture2D(tDiffuse, baseUv).rgb;
                vec3 avg = vec3(0.0);
                float off = 0.0015;
                avg += texture2D(tDiffuse, baseUv + vec2(0.0, off)).rgb;
                avg += texture2D(tDiffuse, baseUv + vec2(0.0, -off)).rgb;
                avg += texture2D(tDiffuse, baseUv + vec2(off, 0.0)).rgb;
                avg += texture2D(tDiffuse, baseUv + vec2(-off, 0.0)).rgb;
                color = center + (center - (avg/4.0)) * 2.5; 
            }
            // 1: 原色像素化 (Pixelated)
            else if (filterType == 1) {
                float pSize = 8.0 + textureIntensity * 20.0;
                vec2 pUv = floor(baseUv * pSize) / pSize;
                color = texture2D(tDiffuse, pUv).rgb;
            }
            // 2: 原色模糊 (Blurred)
            else if (filterType == 2) {
                vec3 blur = vec3(0.0);
                float offset = 0.006;
                blur += texture2D(tDiffuse, baseUv + vec2(-offset, -offset)).rgb;
                blur += texture2D(tDiffuse, baseUv + vec2(offset, offset)).rgb;
                blur += texture2D(tDiffuse, baseUv + vec2(-offset, offset)).rgb;
                blur += texture2D(tDiffuse, baseUv + vec2(offset, -offset)).rgb;
                color = blur / 4.0;
            }
            // 3: 原色噪点 (Noisy)
            else if (filterType == 3) {
                color = texture2D(tDiffuse, baseUv).rgb;
                float noise = rand(vUv + time) * 0.18;
                color += vec3(noise - 0.09);
            }
            // 4: 数字化色差 (Digital Chromatic)
            else if (filterType == 4) {
                float r = texture2D(tDiffuse, baseUv + vec2(0.004, 0.0)).r;
                float g = texture2D(tDiffuse, baseUv).g;
                float b = texture2D(tDiffuse, baseUv - vec2(0.004, 0.0)).b;
                color = vec3(r, g, b);
            }
            // 5: 经典黑白 (B&W)
            else if (filterType == 5) {
                vec3 raw = texture2D(tDiffuse, baseUv).rgb;
                float gray = dot(raw, vec3(0.299, 0.587, 0.114));
                color = vec3(smoothstep(0.15, 0.85, gray));
            }
            // 6: 暖调增强 (Warm)
            else if (filterType == 6) {
                color = texture2D(tDiffuse, baseUv).rgb;
                color.r *= 1.1;
                color.b *= 0.9;
            }

            // 呼吸光效
            vec3 glow = vec3(0.05, 0.08, 0.12) * blinkPulse;
            color += glow;

            // 边框描边
            float borderAlpha = smoothstep(0.0, borderThickness, vUv.x) * smoothstep(1.0, 1.0 - borderThickness, vUv.x) *
                               smoothstep(0.0, borderThickness, vUv.y) * smoothstep(1.0, 1.0 - borderThickness, vUv.y);
            
            if (borderAlpha < 1.0) {
                color = mix(color + 0.1, color, borderAlpha);
            }

            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script>
        const videoElement = document.getElementById('input_video');
        const loading = document.getElementById('loading');
        const uiCanvas = document.getElementById('ui-canvas');
        const uiCtx = uiCanvas.getContext('2d');

        let faceResults = null;
        let handResults = null;
        let lastBlinkState = false;
        let blinkPulse = 0;
        
        let globalHandScale = 1.0; 
        let globalHandRotation = 0.0;
        let isProcessing = false;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.minFilter = THREE.LinearFilter;
        
        const FRAGMENT_COUNT = 45; // 保持 45 个碎片
        const fragments = [];
        const fragGroup = new THREE.Group();
        scene.add(fragGroup);

        const corePoints = [
            1, 4, 5, 197, 195, 2, 33, 133, 159, 145, 
            263, 362, 386, 374, 61, 291, 0, 13, 14, 17, 
            101, 205, 50, 123, 234, 330, 425, 280, 352, 454
        ];

        function createFragment(index) {
            // 进一步缩小基础尺寸：从 0.5-1.2 缩小到 0.35-0.8 左右
            const base = 0.35 + Math.random() * 0.45; 
            const size = { w: base * (0.8 + Math.random() * 0.5), h: base };
            const geometry = new THREE.PlaneGeometry(size.w, size.h);
            const personalUvScale = 0.08 + Math.random() * 0.1; // 采样范围也相应微调

            // 权重分配：原色变体占比更高
            const weights = [0, 0, 1, 1, 2, 2, 3, 3, 4, 5, 6]; 
            const filterIdx = weights[Math.floor(Math.random() * weights.length)];

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    tDiffuse: { value: videoTexture },
                    uvOffset: { value: new THREE.Vector2(0.5, 0.5) },
                    uvRandomOffset: { value: new THREE.Vector2((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1) },
                    uvScale: { value: personalUvScale },
                    filterType: { value: filterIdx },
                    time: { value: 0.0 },
                    borderThickness: { value: 0.025 },
                    textureIntensity: { value: Math.random() }, 
                    blinkPulse: { value: 0.0 }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true
            });

            const mesh = new THREE.Mesh(geometry, material);
            return {
                mesh,
                pointIndex: corePoints[index % corePoints.length],
                zOffset: index * 0.01,
                jitter: new THREE.Vector2((Math.random()-0.5) * 0.08, (Math.random()-0.5) * 0.08),
                burstOffset: new THREE.Vector2(0, 0),
                rotationPhase: Math.random() * Math.PI * 2,
                baseUvScale: personalUvScale,
                individualScale: 0.8 + Math.random() * 0.8 
            };
        }

        for (let i = 0; i < FRAGMENT_COUNT; i++) {
            const f = createFragment(i);
            fragments.push(f);
            fragGroup.add(f.mesh);
        }

        function checkBlink(landmarks) {
            const leftEyeTop = landmarks[159].y;
            const leftEyeBottom = landmarks[145].y;
            return Math.abs(leftEyeTop - leftEyeBottom) < 0.015;
        }

        function triggerBlinkExplosion() {
            blinkPulse = 0.8; 
            fragments.forEach(f => {
                f.burstOffset.set((Math.random()-0.5) * 0.4, (Math.random()-0.5) * 0.4);
            });
        }

        function drawHandUI(landmarks, label, value) {
            const thumb = landmarks[4];
            const index = landmarks[8];
            const x1 = (1 - thumb.x) * uiCanvas.width;
            const y1 = thumb.y * uiCanvas.height;
            const x2 = (1 - index.x) * uiCanvas.width;
            const y2 = index.y * uiCanvas.height;

            uiCtx.beginPath();
            uiCtx.moveTo(x1, y1);
            uiCtx.lineTo(x2, y2);
            uiCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            uiCtx.setLineDash([4, 4]);
            uiCtx.lineWidth = 1;
            uiCtx.stroke();
            uiCtx.setLineDash([]);

            uiCtx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            uiCtx.font = '10px Courier New';
            uiCtx.textAlign = 'center';
            uiCtx.fillText(`${label}: ${value}`, (x1 + x2) / 2, ((y1 + y2) / 2) - 10);
        }

        function update() {
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

            if (handResults?.multiHandLandmarks) {
                handResults.multiHandLandmarks.forEach((landmarks, i) => {
                    const label = handResults.multiHandedness[i].label;
                    if (label === "Left") { // 右手控制缩放
                        const dist = Math.sqrt(Math.pow(landmarks[4].x - landmarks[8].x, 2) + Math.pow(landmarks[4].y - landmarks[8].y, 2));
                        globalHandScale += (Math.min(5.0, Math.max(0.5, dist * 20.0)) - globalHandScale) * 0.15;
                        drawHandUI(landmarks, "SCALE", globalHandScale.toFixed(1));
                    } else { // 左手控制旋转
                        const dist = Math.sqrt(Math.pow(landmarks[4].x - landmarks[8].x, 2) + Math.pow(landmarks[4].y - landmarks[8].y, 2));
                        globalHandRotation += ((dist - 0.05) * 8.0 - globalHandRotation) * 0.15;
                        drawHandUI(landmarks, "ROT", (globalHandRotation * 57.3).toFixed(0));
                    }
                });
            }

            if (!faceResults?.multiFaceLandmarks?.[0]) {
                fragGroup.visible = false;
                return;
            }
            fragGroup.visible = true;

            const landmarks = faceResults.multiFaceLandmarks[0];
            const videoAspect = 640 / 480;
            const worldScale = 14; 
            const currentTime = Date.now() * 0.001;

            const isBlinking = checkBlink(landmarks);
            if (isBlinking && !lastBlinkState) triggerBlinkExplosion();
            lastBlinkState = isBlinking;
            blinkPulse *= 0.94; 

            const noseTip = landmarks[1];
            const headWidth = Math.abs(landmarks[454].x - landmarks[234].x);

            fragments.forEach((frag, i) => {
                const anchor = landmarks[frag.pointIndex];
                const burstEffect = Math.sin(blinkPulse * Math.PI * 0.4);
                
                const targetX = 1 - (anchor.x + (frag.jitter.x * (0.5 + blinkPulse)) + (frag.burstOffset.x * burstEffect));
                const targetY = anchor.y + (frag.jitter.y * (0.5 + blinkPulse)) + (frag.burstOffset.y * burstEffect);

                const breathing = 1.0 + Math.sin(currentTime * 1.5 + frag.rotationPhase) * 0.05;
                const scaleFactor = headWidth * 3.8 * frag.individualScale * globalHandScale * breathing; 
                frag.mesh.scale.set(scaleFactor, scaleFactor, 1);

                frag.mesh.position.lerp(new THREE.Vector3(
                    (targetX - 0.5) * worldScale * videoAspect,
                    -(targetY - 0.5) * worldScale,
                    frag.zOffset + (blinkPulse * 0.3)
                ), 0.2); 
                
                frag.mesh.rotation.z = Math.sin(currentTime * 0.1 + frag.rotationPhase) * 0.05 + globalHandRotation;

                const mat = frag.mesh.material;
                mat.uniforms.uvOffset.value.set(targetX, targetY);
                mat.uniforms.time.value = currentTime;
                mat.uniforms.blinkPulse.value = blinkPulse;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        async function start() {
            uiCanvas.width = window.innerWidth;
            uiCanvas.height = window.innerHeight;

            const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7 });
            faceMesh.onResults(res => { faceResults = res; loading.style.display = 'none'; });

            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6 });
            hands.onResults(res => { handResults = res; });

            new Camera(videoElement, {
                onFrame: async () => {
                    if (isProcessing) return;
                    isProcessing = true;
                    try {
                        await faceMesh.send({image: videoElement}); 
                        await hands.send({image: videoElement});
                    } catch(e) {}
                    isProcessing = false;
                },
                width: 640, height: 480
            }).start();
            animate();
        }

        window.onload = start;
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            uiCanvas.width = window.innerWidth;
            uiCanvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
